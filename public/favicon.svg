<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .globe-bg { fill: #1e40af; }
      .globe-lines { stroke: #60a5fa; stroke-width: 1; fill: none; }
      .globe-dot { fill: #fbbf24; }
    </style>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" class="globe-bg"/>
  <!-- Globe base -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <!-- Horizontal line -->
  <line x1="20" y1="50" x2="80" y2="50" class="globe-lines" stroke-width="1.5"/>
  <!-- Vertical line -->
  <line x1="50" y1="20" x2="50" y2="80" class="globe-lines" stroke-width="1.5"/>
  <!-- Curved lines for latitude -->
  <ellipse cx="50" cy="50" rx="35" ry="20" class="globe-lines" stroke-width="1"/>
  <ellipse cx="50" cy="50" rx="35" ry="15" class="globe-lines" stroke-width="1"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="3" class="globe-dot"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
</svg>
